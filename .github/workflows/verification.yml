name: Verification

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  GITHUB_MD_FORCE_FIDELITY: "1"
  GITHUB_ACTIONS_FORCE_FIDELITY: "1"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install workflow-parsing dependency
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Verify hook behaviour
        run: node --test hooks/

      - name: Verify instruction-gate syntax
        run: node --check hooks/litellm-instruction-gate.cjs

      - name: Verify validator syntax
        run: python3 -m py_compile skills/github-md-template-fidelity/validate_github_md.py skills/github-actions-workflow/validate_github_actions.py skills/steam-workshop-page/validate_steam_workshop_page.py

      - name: Verify GitHub document fidelity
        shell: bash
        run: |
          set -euo pipefail
          for document in README.md ARCHITECTURE.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md PRIVACY.md ROADMAP.md; do
            printf '%s: ' "$document"
            python3 skills/github-md-template-fidelity/validate_github_md.py . "$document" "$document"
          done

      - name: Verify skill frontmatter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          import yaml

          failed = False

          for path in sorted(Path("skills").glob("*/SKILL.md")):
              match = re.match(r"^---\n(.*?)\n---\n", path.read_text(encoding="utf-8"), re.S)

              if match is None:
                  print(f"{path}: missing frontmatter")
                  failed = True
                  continue

              try:
                  document = yaml.safe_load(match.group(1))
              except yaml.YAMLError as error:
                  print(f"{path}: unparsable frontmatter: {error}")
                  failed = True
                  continue

              if document.get("name") != path.parent.name:
                  print(f"{path}: name does not match directory")
                  failed = True

              description = str(document.get("description", ""))

              if len(description) > 1024:
                  print(f"{path}: description is {len(description)} characters")
                  failed = True
                  continue

              if not re.search(r"^description: \".*\"$", match.group(1), re.M):
                  print(f"{path}: description is not a single-line double-quoted scalar")
                  failed = True
                  continue

              print(f"{path}: valid ({len(description)} characters)")

          sys.exit(1 if failed else 0)
          PY

      - name: Verify workflow validity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path

          import yaml

          failed = False

          for path in sorted(Path(".github/workflows").glob("*.y*ml")):
              try:
                  document = yaml.safe_load(path.read_text(encoding="utf-8"))
              except yaml.YAMLError as error:
                  print(f"{path}: invalid YAML: {error}")
                  failed = True
                  continue

              missing = [key for key in ("name", "jobs") if key not in document]

              if missing:
                  print(f"{path}: missing keys: {', '.join(missing)}")
                  failed = True
                  continue

              print(f"{path}: valid")

          sys.exit(1 if failed else 0)
          PY