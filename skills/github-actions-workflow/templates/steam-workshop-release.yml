name: Steam Workshop

on:
  push:
    tags:
    - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.tag || github.ref_name }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.VERSION }}

    - name: Build the release archive
      run: |
        zip -r "release.zip" [[RELEASE_ASSETS_LIST]]

    - name: Extract the release archive
      run: |
        unzip "release.zip" -d "release/"

    - name: Upload
      uses: hmlendea/steam-workshop-update@latest
      with:
        appid: [[STEAM_APP_ID]]
        itemid: [[STEAM_WORKSHOP_ITEM_ID]]
        path: "release/[[RELEASE_ASSET_LABEL]]/"
        changenote: "[url=https://github.com/[[GITHUB_REPO_USERNAME]]/[[GITHUB_REPO_NAME]]/releases/tag/${{env.VERSION}}]Version ${{env.VERSION}}[/url]"
        icon: "release/[[RELEASE_ASSET_LABEL]]/[[STEAM_PREVIEW_IMAGE]]"
      env:
        STEAM_USERNAME: ${{secrets.STEAM_USERNAME}}
        STEAM_PASSWORD: ${{secrets.STEAM_PASSWORD}}
        STEAM_2FASEED: ${{secrets.STEAM_2FA_SEED}}
